<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify Email | TechTaskSoln</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center">

  <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-8 w-full max-w-md">

    <!-- Header -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-7 h-7 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-semibold text-slate-900 dark:text-white">Check your email</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
        We sent a 6-digit code to <span id="emailDisplay" class="font-medium text-slate-700 dark:text-slate-200"></span>
      </p>
    </div>

    <!-- OTP Input -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
        Verification code
      </label>
      <input
        type="text"
        id="otpInput"
        maxlength="6"
        placeholder="Enter 6-digit code"
        class="w-full px-4 py-3 text-center text-2xl tracking-widest border border-slate-300 dark:border-slate-600 rounded-xl bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- Error / Success messages -->
    <p id="errorMsg" class="text-sm text-red-500 text-center mb-3 hidden"></p>
    <p id="successMsg" class="text-sm text-green-600 text-center mb-3 hidden"></p>

    <!-- Verify Button -->
    <button
      id="verifyBtn"
      onclick="verifyOTP()"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition duration-200"
    >
      Verify Email
    </button>

    <!-- Resend -->
    <div class="text-center mt-5 text-sm text-slate-500 dark:text-slate-400">
      Didn't receive a code?
      <button
        id="resendBtn"
        onclick="resendOTP()"
        class="text-blue-600 hover:underline font-medium ml-1"
      >
        Resend code
      </button>
      <span id="resendTimer" class="text-slate-400 ml-1 hidden"></span>
    </div>

    <!-- Back to login -->
    <div class="text-center mt-3 text-sm">
      <a href="/login/" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
        ← Back to login
      </a>
    </div>

  </div>

  <script>
    const email = localStorage.getItem('pending_verification_email');

    // If no email in storage, send back to register
    if (!email) {
      window.location.href = '/register/';
    }

    document.getElementById('emailDisplay').textContent = email;

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('successMsg').classList.add('hidden');
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('errorMsg').classList.add('hidden');
    }

    async function verifyOTP() {
      const otp = document.getElementById('otpInput').value.trim();
      const btn = document.getElementById('verifyBtn');

      if (otp.length !== 6 || isNaN(otp)) {
        showError('Please enter a valid 6-digit code.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const res = await fetch('/api/auth/verify-email/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp })
        });

        const data = await res.json();

        if (res.ok) {
          showSuccess(data.message);
          localStorage.removeItem('pending_verification_email');
          setTimeout(() => window.location.href = '/login/', 2000);
        } else {
          showError(data.error || 'Verification failed. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Verify Email';
        }
      } catch (err) {
        showError('Network error. Please check your connection.');
        btn.disabled = false;
        btn.textContent = 'Verify Email';
      }
    }

    // Allow pressing Enter to submit
    document.getElementById('otpInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') verifyOTP();
    });

    // Resend with 60-second cooldown
    async function resendOTP() {
      const btn = document.getElementById('resendBtn');
      const timer = document.getElementById('resendTimer');

      btn.disabled = true;
      btn.classList.add('opacity-40');

      try {
        const res = await fetch('/api/auth/resend-otp/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (res.ok) {
          showSuccess(data.message);
          // 60 second countdown
          let seconds = 60;
          timer.classList.remove('hidden');
          const interval = setInterval(() => {
            seconds--;
            timer.textContent = `(wait ${seconds}s)`;
            if (seconds <= 0) {
              clearInterval(interval);
              btn.disabled = false;
              btn.classList.remove('opacity-40');
              timer.classList.add('hidden');
            }
          }, 1000);
        } else {
          showError(data.error || 'Could not resend code.');
          btn.disabled = false;
          btn.classList.remove('opacity-40');
        }
      } catch (err) {
        showError('Network error. Please try again.');
        btn.disabled = false;
        btn.classList.remove('opacity-40');
      }
    }
  </script>

</body>
</html>
