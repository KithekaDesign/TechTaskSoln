<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TechTaskSoln - Register</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#add8e6",
                        "background-light": "#f6f7f8",
                        "background-dark": "#141c1e",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 px-6 lg:px-40 py-3 bg-white dark:bg-background-dark">
<a href="/" class="flex items-center gap-4 text-slate-900 dark:text-slate-100 no-underline">
<div class="size-8 flex items-center justify-center bg-primary rounded-lg">
<span class="material-symbols-outlined text-slate-900">terminal</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight">TechTaskSoln</h2>
</a>
<div class="flex flex-1 justify-end gap-8">
<div class="flex items-center gap-9">
<a class="text-slate-600 dark:text-slate-400 text-sm font-medium hover:text-primary transition-colors" href="/login/">Login</a>
</div>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-slate-900 text-sm font-bold leading-normal tracking-wide hover:brightness-105 transition-all">
<span>Sign Up</span>
</button>
</div>
</header>
<main class="flex flex-1 justify-center py-10 px-4 lg:px-40">
<div class="layout-content-container flex flex-col max-w-[520px] flex-1 bg-white dark:bg-slate-900/50 p-8 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800">
<div class="flex flex-col gap-3 mb-8">
<h1 class="text-slate-900 dark:text-slate-100 text-4xl font-black leading-tight tracking-tight">Create Account</h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal">Join our community of innovators and builders</p>
</div>
<form id="registerForm" class="flex flex-col gap-6">
<div class="flex flex-col gap-3">
<h3 class="text-slate-900 dark:text-slate-100 text-sm font-bold uppercase tracking-wider">I am a:</h3>
<div class="flex h-12 items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800 p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-slate-700 has-[:checked]:shadow-sm has-[:checked]:text-slate-900 dark:has-[:checked]:text-white text-slate-500 dark:text-slate-400 text-sm font-semibold transition-all">
<span class="truncate flex items-center gap-2">
<span class="material-symbols-outlined text-lg">person_search</span> Client
                                    </span>
<input class="invisible w-0" name="user_role" type="radio" value="client" id="role_client"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-slate-700 has-[:checked]:shadow-sm has-[:checked]:text-slate-900 dark:has-[:checked]:text-white text-slate-500 dark:text-slate-400 text-sm font-semibold transition-all">
<span class="truncate flex items-center gap-2">
<span class="material-symbols-outlined text-lg">code</span> Freelancer
                                    </span>
<input checked="" class="invisible w-0" name="user_role" type="radio" value="freelancer" id="role_freelancer"/>
</label>
</div>
</div>
<div class="flex flex-col gap-4">
<label class="flex flex-col gap-2">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold">Full Name</p>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">person</span>
<input id="fullname" class="flex w-full rounded-lg text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 h-12 pl-12 pr-4 placeholder:text-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="e.g. Alex Johnson" type="text"/>
</div>
</label>
<label class="flex flex-col gap-2">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold">Email Address</p>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">mail</span>
<input id="email" class="flex w-full rounded-lg text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 h-12 pl-12 pr-4 placeholder:text-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="alex@example.com" type="email"/>
</div>
</label>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<label class="flex flex-col gap-2">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold">Password</p>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
<input id="password" class="flex w-full rounded-lg text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 h-12 pl-12 pr-4 placeholder:text-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="••••••••" type="password"/>
</div>
</label>
<label class="flex flex-col gap-2">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold">Confirm Password</p>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">lock_reset</span>
<input id="password_confirm" class="flex w-full rounded-lg text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 h-12 pl-12 pr-4 placeholder:text-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="••••••••" type="password"/>
</div>
</label>
</div>
</div>
<div class="flex items-start gap-3 mt-2">
<input class="mt-1 rounded border-slate-300 text-primary focus:ring-primary h-4 w-4" id="terms" type="checkbox"/>
<label class="text-xs text-slate-500 dark:text-slate-400 leading-normal" for="terms">
                                I agree to the <a class="text-primary hover:underline font-semibold" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-semibold" href="#">Privacy Policy</a>.
                            </label>
</div>
<button class="w-full flex items-center justify-center h-12 bg-primary text-slate-900 font-bold rounded-lg hover:brightness-105 shadow-lg shadow-primary/20 transition-all mt-4" type="submit">
                            Create My Account
                        </button>
<p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-4">
                            Already have an account? <a class="text-primary font-bold hover:underline" href="/login/">Log in</a>
</p>
</form>
</div>
</main>
<footer class="px-6 lg:px-40 py-10 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-background-dark">
<div class="flex flex-col md:flex-row justify-between items-center gap-6">
<div class="flex items-center gap-2 opacity-60">
<span class="material-symbols-outlined text-sm">copyright</span>
<span class="text-sm font-medium">2025 TechTaskSoln Inc. All rights reserved.</span>
</div>
<div class="flex gap-6">
<a class="text-slate-500 hover:text-primary transition-colors" href="#"><span class="material-symbols-outlined">language</span></a>
<a class="text-slate-500 hover:text-primary transition-colors" href="#"><span class="material-symbols-outlined">hub</span></a>
<a class="text-slate-500 hover:text-primary transition-colors" href="#"><span class="material-symbols-outlined">campaign</span></a>
</div>
</div>
</footer>
</div>
</div>
<script src="/static/js/api.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const fullname = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('password_confirm').value;
    const role = document.querySelector('input[name="user_role"]:checked').value;
    const termsChecked = document.getElementById('terms').checked;

    // Client-side validation
    if (!fullname || !email || !password) { showAlert('Please fill all required fields.'); return; }
    if (password !== passwordConfirm) { showAlert('Passwords do not match.'); return; }
    if (password.length < 8) { showAlert('Password must be at least 8 characters.'); return; }
    if (!termsChecked) { showAlert('Please agree to the Terms of Service.'); return; }

    // Derive username from full name (lowercase, spaces → underscores)
    const username = fullname.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');

    const submitBtn = document.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';

    try {
        const res = await fetch('/api/auth/register/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password, password_confirm: passwordConfirm, role })
        });

        const data = await res.json();

        if (res.ok || res.status === 201) {
            // Save email so verify-email page knows who to verify
            localStorage.setItem('pending_verification_email', data.email);
            showAlert('Account created! Check your email for a verification code.', 'success');
            setTimeout(() => window.location.href = '/verify-email/', 1500);
        } else {
            // Show exact field errors from backend
            const msg = Object.values(data).flat().join(' ');
            showAlert(msg || 'Registration failed. Please try again.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create My Account';
        }
    } catch (e) {
        showAlert('Network error. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create My Account';
    }
});
</script>
</body></html>
