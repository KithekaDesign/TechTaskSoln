<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#add8e6",
                        "background-light": "#f6f7f8",
                        "background-dark": "#141c1e",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Login | TechTaskSoln</title>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<!-- Navigation / Header -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 px-6 md:px-20 lg:px-40 py-4 bg-white dark:bg-background-dark/50 backdrop-blur-sm sticky top-0 z-50">
<a href="/" class="flex items-center gap-4 no-underline">
<div class="text-primary flex items-center justify-center">
<span class="material-symbols-outlined text-3xl">terminal</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-xl font-bold leading-tight tracking-tight">TechTaskSoln</h2>
</a>
<div class="flex items-center gap-4">
<span class="text-sm text-slate-500 dark:text-slate-400 hidden sm:block">Need an account?</span>
<a class="text-sm font-semibold text-slate-900 dark:text-slate-100 hover:text-primary transition-colors" href="/register/">Register</a>
</div>
</header>
<main class="flex-1 flex items-center justify-center p-6">
<div class="w-full max-w-[480px] space-y-8 bg-white dark:bg-slate-900/50 p-8 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800">
<!-- Welcome Message -->
<div class="flex flex-col gap-2 text-center sm:text-left">
<h1 class="text-slate-900 dark:text-slate-100 text-3xl font-black leading-tight tracking-tight">Welcome back</h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal">Log in to your SaaS account to continue managing your tasks.</p>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-sm font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all">
<span class="material-symbols-outlined text-lg">database</span>
<span>GitHub</span>
</button>
<button class="flex items-center justify-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-sm font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all">
<span class="material-symbols-outlined text-lg">search</span>
<span>Google</span>
</button>
</div>
<div class="relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-slate-800"></div>
</div>
<div class="relative flex justify-center text-sm font-medium leading-6">
<span class="bg-white dark:bg-slate-900 px-4 text-slate-400">Or continue with email</span>
</div>
</div>
<!-- Login Form -->
<form id="loginForm" class="space-y-6">
<div class="space-y-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="flex w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-2 focus:ring-primary/20 h-12 pl-11 pr-4 placeholder:text-slate-400 text-sm transition-all outline-none" id="email" placeholder="you@example.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="flex w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-2 focus:ring-primary/20 h-12 pl-11 pr-4 placeholder:text-slate-400 text-sm transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center gap-2">
<input class="rounded border-slate-300 text-primary focus:ring-primary h-4 w-4" id="remember" type="checkbox"/>
<label class="text-sm text-slate-500 dark:text-slate-400" for="remember">Keep me logged in</label>
</div>
<p id="errorMsg" class="hidden text-sm text-red-600 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg px-4 py-3"></p>
<button id="loginBtn" class="w-full flex items-center justify-center rounded-lg bg-primary h-12 px-6 text-slate-900 text-base font-bold tracking-tight hover:opacity-90 transition-opacity shadow-sm" type="submit">
    Login
</button>
</form>
<!-- Footer Link -->
<p class="text-center text-sm text-slate-500 dark:text-slate-400">
                        Don't have an account? 
                        <a class="font-bold text-slate-900 dark:text-slate-100 hover:text-primary transition-colors underline underline-offset-4 decoration-primary" href="/register/">Create an account</a>
</p>
</div>
</main>
<footer class="py-10 text-center">
<p class="text-xs text-slate-400 dark:text-slate-600">© 2025 TechTaskSoln Inc. All rights reserved.</p>
<div class="flex justify-center gap-6 mt-4">
<a class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-300" href="#">Privacy Policy</a>
<a class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-300" href="#">Terms of Service</a>
</div>
</footer>
</div>
</div>
<script src="/static/js/api.js"></script>
<script>
// Redirect if already logged in
if (isLoggedIn()) {
    fetchUserInfo().then(info => {
        if (info && info.is_client) window.location.href = '/client/dashboard/';
        else if (info && info.is_freelancer) window.location.href = '/freelancer/dashboard/';
        else window.location.href = '/';
    });
}

function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.remove('hidden');
}

function hideError() {
    document.getElementById('errorMsg').classList.add('hidden');
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const loginBtn = document.getElementById('loginBtn');

    if (!email || !password) { showError('Please enter email and password.'); return; }

    hideError();
    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in...';

    try {
        const res = await fetch('/api/auth/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
            setTokens(data.access, data.refresh);
            localStorage.removeItem('user_info');
            const info = await fetchUserInfo();
            setTimeout(() => {
                if (info && info.is_client) window.location.href = '/client/dashboard/';
                else if (info && info.is_freelancer) window.location.href = '/freelancer/dashboard/';
                else window.location.href = '/';
            }, 300);
        } else {
            // Handles: wrong password, unverified email, inactive account
            const msg = data.detail
                || (data.non_field_errors && data.non_field_errors[0])
                || 'Login failed. Please check your credentials.';

            // If unverified, offer to go to verify page
            if (msg.toLowerCase().includes('verify')) {
                showError(msg + ' Click here to verify your email.');
                document.getElementById('errorMsg').style.cursor = 'pointer';
                document.getElementById('errorMsg').onclick = () => window.location.href = '/verify-email/';
            } else {
                showError(msg);
            }
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
        }
    } catch (e) {
        showError('Network error. Please try again.');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
    }
});
</script>
</body></html>
