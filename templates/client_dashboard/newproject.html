<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Post New Project | TechTaskSoln</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#add8e6",
                    "navy": "#1e3a8a",
                    "background-light": "#f6f7f8",
                    "background-dark": "#141c1e",
                },
                fontFamily: { "display": ["Manrope", "sans-serif"] },
                borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
        },
    }
</script>
<style>
    body { font-family: 'Manrope', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .skill-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 9999px; background: rgba(173,216,230,0.15); border: 1px solid rgba(173,216,230,0.4); font-size: 12px; font-weight: 600; }
    .skill-tag button { cursor: pointer; background: none; border: none; padding: 0; display: flex; align-items: center; color: #64748b; }
    .skill-tag button:hover { color: #ef4444; }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">

<script src="/static/js/api.js"></script>
<script src="/static/js/sidebar.js"></script>

<main class="min-h-screen p-6 md:p-10 max-w-3xl mx-auto">
    <header class="mb-8 flex items-center gap-4">
        <button onclick="toggleSidebar()" class="flex items-center justify-center size-10 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-700 dark:text-slate-300" aria-label="Toggle sidebar">
            <span class="material-symbols-outlined text-2xl">menu</span>
        </button>
        <div>
            <h2 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">Post New Project</h2>
            <p class="text-slate-500 dark:text-slate-400 mt-1">Create a detailed project listing to attract the best tech talent.</p>
        </div>
    </header>

    <form id="newProjectForm" class="space-y-6">

        <!-- Basic Info -->
        <section class="bg-white dark:bg-slate-900 p-8 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
            <h3 class="font-bold text-lg text-navy dark:text-primary flex items-center gap-2">
                <span class="material-symbols-outlined">info</span> Project Details
            </h3>

            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Project Title <span class="text-red-500">*</span></label>
                <input id="projectTitle" class="w-full h-12 px-4 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-primary text-slate-900 dark:text-white transition-all" placeholder="e.g. Build a High-Performance E-commerce Mobile App" type="text"/>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Category <span class="text-red-500">*</span></label>
                    <select id="projectCategory" class="w-full h-12 px-4 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary text-slate-900 dark:text-white transition-all">
                        <option value="" disabled selected>Select a category</option>
                        <option value="web_development">Web Development</option>
                        <option value="mobile_development">Mobile Development</option>
                        <option value="ui_ux_design">UI/UX Design</option>
                        <option value="devops_cloud">DevOps & Cloud</option>
                        <option value="ai_ml">AI & Machine Learning</option>
                        <option value="cybersecurity">Cybersecurity</option>
                        <option value="data_science">Data Science</option>
                        <option value="blockchain">Blockchain</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Deadline <span class="text-red-500">*</span></label>
                    <input id="projectDeadline" class="w-full h-12 px-4 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary text-slate-900 dark:text-white transition-all" type="date"/>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Budget ($) <span class="text-red-500">*</span></label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">$</span>
                    <input id="projectBudget" type="number" min="50" max="1000000" placeholder="e.g. 5000"
                        class="w-full h-12 pl-8 pr-4 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary text-slate-900 dark:text-white transition-all"/>
                </div>
                <p class="text-xs text-slate-400 mt-1">Enter your total project budget in USD</p>
            </div>
        </section>

        <!-- Description & Skills -->
        <section class="bg-white dark:bg-slate-900 p-8 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
            <h3 class="font-bold text-lg text-navy dark:text-primary flex items-center gap-2">
                <span class="material-symbols-outlined">description</span> Project Scope
            </h3>

            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Description <span class="text-red-500">*</span></label>
                <textarea id="projectDescription" class="w-full p-4 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary text-slate-900 dark:text-white transition-all resize-none" placeholder="Describe the project goals, requirements, deliverables, and any specific technical requirements..." rows="6"></textarea>
                <p class="text-xs text-slate-400 mt-1"><span id="desc-count">0</span>/2000 characters</p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Required Skills</label>
                <div id="skills-container" class="flex flex-wrap gap-2 mb-3 min-h-[36px]"></div>
                <div class="flex gap-2">
                    <input id="skillInput" class="flex-1 h-10 px-4 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary text-slate-900 dark:text-white text-sm transition-all" placeholder="Type a skill and press Enter (e.g. React, Node.js, Docker)" type="text"/>
                    <button type="button" onclick="addSkill()" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 rounded-lg text-sm font-bold hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Add</button>
                </div>
                <input type="hidden" id="projectSkills"/>
            </div>
        </section>

        <!-- Action Buttons -->
        <div class="flex items-center justify-between gap-4 pt-2">
            <a href="/client/projects/" class="px-6 py-3 rounded-lg text-slate-600 dark:text-slate-400 font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                Cancel
            </a>
            <div class="flex gap-3">
                <button id="draftBtn" type="button" onclick="saveDraft()" class="px-6 py-3 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors flex items-center gap-2">
                    <span class="material-symbols-outlined text-base">save</span> Save Draft
                </button>
                <button id="submitBtn" type="submit" class="px-8 py-3 rounded-lg bg-navy text-white font-bold shadow-md hover:opacity-90 hover:shadow-lg transition-all transform active:scale-[0.98] flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span class="material-symbols-outlined text-base">rocket_launch</span>
                    <span id="submitBtnText">Post Project</span>
                </button>
            </div>
        </div>
    </form>

    <!-- Footer Stats -->
    <footer class="mt-16 pt-8 border-t border-slate-200 dark:border-slate-800 grid grid-cols-3 gap-6 text-center">
        <div>
            <p class="text-2xl font-black text-navy dark:text-primary">12k+</p>
            <p class="text-xs text-slate-500 mt-1">Active Talent</p>
        </div>
        <div>
            <p class="text-2xl font-black text-navy dark:text-primary">98%</p>
            <p class="text-xs text-slate-500 mt-1">Success Rate</p>
        </div>
        <div>
            <p class="text-2xl font-black text-navy dark:text-primary">24h</p>
            <p class="text-xs text-slate-500 mt-1">Avg. First Bid</p>
        </div>
    </footer>
</main>

<script>
(async function() {
    if (!requireAuth()) return;

    const userInfo = await fetchUserInfo();
    if (userInfo && !userInfo.is_client) {
        showAlert('Only clients can post projects.', 'error');
        setTimeout(() => window.location.href = '/freelancer/dashboard/', 1500);
        return;
    }

    // Set minimum date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('projectDeadline').min = today;

    // Character counter for description
    document.getElementById('projectDescription').addEventListener('input', function() {
        document.getElementById('desc-count').textContent = this.value.length;
    });

    // Skill input on Enter key
    document.getElementById('skillInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); addSkill(); }
    });

    // Form submit
    document.getElementById('newProjectForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        await submitProject('OPEN');
    });
})();

const skills = [];

function addSkill() {
    const input = document.getElementById('skillInput');
    const raw = input.value.trim();
    if (!raw) return;

    // Support comma-separated input
    raw.split(',').forEach(s => {
        const skill = s.trim();
        if (skill && !skills.includes(skill) && skills.length < 15) {
            skills.push(skill);
        }
    });
    input.value = '';
    renderSkills();
    document.getElementById('projectSkills').value = skills.join(', ');
}

function removeSkill(skill) {
    const idx = skills.indexOf(skill);
    if (idx > -1) skills.splice(idx, 1);
    renderSkills();
    document.getElementById('projectSkills').value = skills.join(', ');
}

function renderSkills() {
    const container = document.getElementById('skills-container');
    container.innerHTML = skills.map(s => `
        <span class="skill-tag">
            ${s}
            <button type="button" onclick="removeSkill('${s}')" title="Remove skill">
                <span class="material-symbols-outlined" style="font-size:14px">close</span>
            </button>
        </span>
    `).join('');
}

async function submitProject(status) {
    const title = document.getElementById('projectTitle').value.trim();
    const description = document.getElementById('projectDescription').value.trim();
    const deadline = document.getElementById('projectDeadline').value;
    const budget = document.getElementById('projectBudget').value;
    const category = document.getElementById('projectCategory').value;

    if (!title) { showAlert('Project title is required.', 'error'); return; }
    if (!description) { showAlert('Project description is required.', 'error'); return; }
    if (!deadline) { showAlert('Deadline is required.', 'error'); return; }
    if (!budget || parseFloat(budget) <= 0) { showAlert('Please enter a valid budget.', 'error'); return; }

    const submitBtn = document.getElementById('submitBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    submitBtn.disabled = true;
    submitBtnText.textContent = 'Posting...';

    const payload = {
        title,
        description,
        budget: parseFloat(budget),
        required_skills: skills.join(', ') || 'General',
        deadline,
        status: status || 'OPEN'
    };

    if (category) payload.category = category;

    const res = await apiCall('/projects/', 'POST', payload);

    if (res && (res.ok || res.status === 201)) {
        const project = await res.json();
        showAlert('Project posted successfully! Redirecting...', 'success');
        setTimeout(() => window.location.href = '/client/projects/', 1500);
    } else {
        submitBtn.disabled = false;
        submitBtnText.textContent = 'Post Project';
        if (res) {
            try {
                const err = await res.json();
                const msg = Object.entries(err).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(', ') : v}`).join(' | ');
                showAlert(msg || 'Failed to create project.', 'error');
            } catch {
                showAlert('Failed to create project. Please try again.', 'error');
            }
        }
    }
}

async function saveDraft() {
    const title = document.getElementById('projectTitle').value.trim();
    if (!title) { showAlert('Please enter a project title before saving as draft.', 'error'); return; }

    const draftBtn = document.getElementById('draftBtn');
    draftBtn.disabled = true;
    draftBtn.textContent = 'Saving...';

    await submitProject('OPEN');
}
</script>
</body>
</html>
