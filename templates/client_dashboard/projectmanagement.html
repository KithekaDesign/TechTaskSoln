<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TechTaskSoln | Project Management</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#add8e6",
                    "navy": "#1e3a8a",
                    "background-light": "#f6f7f8",
                    "background-dark": "#141c1e",
                },
                fontFamily: { "display": ["Manrope"] },
                borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
        },
    }
</script>
<style>
    body { font-family: 'Manrope', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .status-open { background:#dcfce7; color:#166534; }
    .status-in_progress { background:#dbeafe; color:#1e40af; }
    .status-completed { background:#f1f5f9; color:#475569; }
    .project-card { cursor:pointer; transition: all 0.15s; }
    .project-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .project-card.selected { border-color: #add8e6 !important; background: rgba(173,216,230,0.05); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; display: inline-block; }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">

<script src="/static/js/api.js"></script>
<script src="/static/js/sidebar.js"></script>
<script src="/static/js/blockchain.js"></script>

<main class="min-h-screen p-6 md:p-8">

    <!-- Page Header -->
    <header class="flex items-center justify-between mb-8 gap-4 flex-wrap">
        <div class="flex items-center gap-4">
            <button onclick="toggleSidebar()" class="flex items-center justify-center size-10 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-700 dark:text-slate-300" aria-label="Toggle sidebar">
                <span class="material-symbols-outlined text-2xl">menu</span>
            </button>
            <div>
                <h2 class="text-2xl font-extrabold tracking-tight">My Projects</h2>
                <p class="text-slate-500 text-sm mt-0.5" id="projects-subtitle">Loading your projects...</p>
            </div>
        </div>
        <a href="/client/projects/new/" class="flex items-center gap-2 bg-navy text-white px-5 py-2.5 rounded-lg font-bold text-sm hover:opacity-90 transition-all shadow-sm">
            <span class="material-symbols-outlined text-base">add</span> New Project
        </a>
    </header>

    <!-- Loading state -->
    <div id="loading-state" class="text-center py-24">
        <span class="material-symbols-outlined text-5xl text-slate-300 spinner">autorenew</span>
        <p class="text-slate-400 mt-4">Loading your projects...</p>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-24">
        <span class="material-symbols-outlined text-6xl text-slate-200">work_off</span>
        <h3 class="text-xl font-bold text-slate-400 mt-4">No projects yet</h3>
        <p class="text-slate-400 mt-2">Post your first project to start finding talented freelancers.</p>
        <a href="/client/projects/new/" class="inline-flex items-center gap-2 mt-6 bg-navy text-white px-6 py-3 rounded-lg font-bold hover:opacity-90 transition-all">
            <span class="material-symbols-outlined">add</span> Post a Project
        </a>
    </div>

    <!-- Main content: project list + detail -->
    <div id="main-content" class="hidden grid grid-cols-1 xl:grid-cols-3 gap-6">

        <!-- Project List (left column) -->
        <div class="xl:col-span-1 space-y-3" id="project-list"></div>

        <!-- Project Detail (right columns) -->
        <div class="xl:col-span-2 space-y-6" id="project-detail">
            <div class="text-center py-20 text-slate-400">
                <span class="material-symbols-outlined text-5xl">arrow_back</span>
                <p class="mt-3">Select a project to view details</p>
            </div>
        </div>
    </div>
</main>

<script>
let allProjects = [];
let selectedProject = null;
let userInfo = null;

(async function() {
    if (!requireAuth()) return;
    userInfo = await fetchUserInfo();

    const res = await apiCall('/projects/');
    document.getElementById('loading-state').classList.add('hidden');

    if (!res || !res.ok) {
        showAlert('Failed to load projects.', 'error');
        return;
    }

    const data = await res.json();
    allProjects = (data.results || data).filter(p => p.client === userInfo.id);

    document.getElementById('projects-subtitle').textContent =
        `${allProjects.length} project${allProjects.length !== 1 ? 's' : ''} found`;

    if (allProjects.length === 0) {
        document.getElementById('empty-state').classList.remove('hidden');
        return;
    }

    document.getElementById('main-content').classList.remove('hidden');
    renderProjectList();

    // Auto-select first project
    selectProject(allProjects[0]);
})();

function renderProjectList() {
    const container = document.getElementById('project-list');
    container.innerHTML = allProjects.map(p => {
        const statusClass = `status-${p.status.toLowerCase().replace('_', '_')}`;
        const deadline = new Date(p.deadline).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        return `
            <div class="project-card bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm"
                 onclick="selectProject(${JSON.stringify(p).replace(/"/g, '&quot;')})" id="card-${p.id}">
                <div class="flex items-start justify-between gap-2 mb-3">
                    <h3 class="font-bold text-sm leading-tight line-clamp-2">${p.title}</h3>
                    <span class="text-[10px] font-bold px-2 py-1 rounded-full whitespace-nowrap ${statusClass}">
                        ${p.status.replace('_', ' ')}
                    </span>
                </div>
                <div class="flex items-center justify-between text-xs text-slate-500">
                    <span class="flex items-center gap-1">
                        <span class="material-symbols-outlined" style="font-size:14px">payments</span>
                        $${parseFloat(p.budget).toLocaleString()}
                    </span>
                    <span class="flex items-center gap-1">
                        <span class="material-symbols-outlined" style="font-size:14px">event</span>
                        ${deadline}
                    </span>
                </div>
            </div>
        `;
    }).join('');
}

async function selectProject(project) {
    selectedProject = project;

    // Highlight selected card
    document.querySelectorAll('.project-card').forEach(c => c.classList.remove('selected'));
    const card = document.getElementById(`card-${project.id}`);
    if (card) card.classList.add('selected');

    // Load proposals for this project using the per-project endpoint
    const propRes = await apiCall(`/proposals/project/${project.id}/`);
    let proposals = [];
    if (propRes && propRes.ok) {
        const data = await propRes.json();
        proposals = data.results || data;
    }

    renderProjectDetail(project, proposals);
}

function renderProjectDetail(project, proposals) {
    const deadline = new Date(project.deadline).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    const created = new Date(project.created_at || Date.now()).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    const statusClass = `status-${project.status.toLowerCase()}`;
    const skills = (project.required_skills || '').split(',').map(s => s.trim()).filter(Boolean);

    const acceptedProposal = proposals.find(p => p.status === 'ACCEPTED');
    const pendingProposals = proposals.filter(p => p.status === 'PENDING');

    const detail = document.getElementById('project-detail');
    detail.innerHTML = `
        <!-- Project Header -->
        <div class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <div class="flex items-start justify-between gap-4 mb-4">
                <div>
                    <h2 class="text-xl font-extrabold tracking-tight">${project.title}</h2>
                    <p class="text-slate-500 text-sm mt-1">Posted ${created} · ID #${project.id}</p>
                </div>
                <span class="text-xs font-bold px-3 py-1.5 rounded-full whitespace-nowrap ${statusClass}">
                    ${project.status.replace('_', ' ')}
                </span>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-4">
                <div class="bg-slate-50 dark:bg-slate-800 p-3 rounded-lg">
                    <p class="text-xs text-slate-500 font-medium">Budget</p>
                    <p class="font-bold text-lg">$${parseFloat(project.budget).toLocaleString()}</p>
                </div>
                <div class="bg-slate-50 dark:bg-slate-800 p-3 rounded-lg">
                    <p class="text-xs text-slate-500 font-medium">Deadline</p>
                    <p class="font-bold text-sm">${new Date(project.deadline).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</p>
                </div>
                <div class="bg-slate-50 dark:bg-slate-800 p-3 rounded-lg">
                    <p class="text-xs text-slate-500 font-medium">Proposals</p>
                    <p class="font-bold text-lg">${proposals.length}</p>
                </div>
            </div>
            <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed mb-4">${project.description || 'No description provided.'}</p>
            ${skills.length > 0 ? `
                <div class="flex flex-wrap gap-2">
                    ${skills.map(s => `<span class="px-3 py-1 bg-primary/10 text-navy dark:text-primary rounded-full text-xs font-semibold border border-primary/20">${s}</span>`).join('')}
                </div>
            ` : ''}
            <div class="flex gap-3 mt-4">
                <a href="/projects/${project.id}/" class="flex items-center gap-1 text-sm font-bold text-navy dark:text-primary hover:underline">
                    <span class="material-symbols-outlined text-base">open_in_new</span> View Full Page
                </a>
                ${project.status === 'COMPLETED' ? `
                <a href="/client/projects/${project.id}/review/" class="flex items-center gap-2 ml-auto px-4 py-2 bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-lg text-sm font-bold hover:brightness-110 transition-all shadow-md">
                    <span class="material-symbols-outlined text-base">payments</span> Review & Release Funds
                </a>
                ` : `
                <button onclick="deleteProject(${project.id})" class="flex items-center gap-1 text-sm font-bold text-red-500 hover:text-red-700 ml-auto">
                    <span class="material-symbols-outlined text-base">delete</span> Delete
                </button>
                `}
            </div>
        </div>

        <!-- Escrow Payment Panel -->
        <div class="bg-white dark:bg-slate-900 p-6 rounded-xl border-2 border-primary/30 shadow-sm">
            <h3 class="font-bold text-base mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">security</span>
                Blockchain Escrow Payment
            </h3>
            <div id="escrow-panel-${project.id}">
                <p class="text-slate-400 text-sm">Loading escrow status...</p>
            </div>
        </div>

        <!-- Proposals Section -->
        <div class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">description</span>
                    Proposals
                    ${pendingProposals.length > 0 ? `<span class="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-0.5 rounded-full">${pendingProposals.length} pending</span>` : ''}
                </h3>
            </div>
            ${proposals.length === 0 ? `
                <div class="text-center py-8 text-slate-400">
                    <span class="material-symbols-outlined text-4xl">inbox</span>
                    <p class="mt-2 text-sm">No proposals yet. Share your project link to attract freelancers.</p>
                </div>
            ` : proposals.map(p => renderProposalCard(p)).join('')}
        </div>
    `;

    // Load escrow panel
    const freelancerWallet = acceptedProposal ? (acceptedProposal.freelancer_wallet || '') : '';
    const budgetEth = parseFloat(project.budget) / 3000; // Approximate USD to ETH conversion
    renderEscrowPanel(project.id, 'client', freelancerWallet, budgetEth.toFixed(4));
}

function renderProposalCard(p) {
    const statusColors = {
        'PENDING': 'bg-amber-100 text-amber-700',
        'ACCEPTED': 'bg-green-100 text-green-700',
        'REJECTED': 'bg-red-100 text-red-700'
    };
    const fp = p.freelancer_profile;
    const fullName = fp ? ([fp.first_name, fp.last_name].filter(Boolean).join(' ') || p.freelancer_username) : (p.freelancer_username || 'Freelancer #' + p.freelancer);
    const initials = fullName.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) || 'F';
    return `
        <div class="border border-slate-200 dark:border-slate-700 rounded-xl p-5 mb-3 last:mb-0">
            <div class="flex items-start justify-between gap-3 mb-3">
                <div class="flex items-center gap-3">
                    <div class="size-9 rounded-full bg-primary/20 flex items-center justify-center font-bold text-navy dark:text-primary text-sm">
                        ${initials}
                    </div>
                    <div>
                        <p class="font-bold text-sm">${fullName}</p>
                        <p class="text-xs text-slate-500">Delivery: ${p.delivery_time} days · Bid: $${parseFloat(p.bid_amount).toLocaleString()}</p>
                        ${fp?.title ? `<p class="text-xs text-slate-400 mt-0.5">${fp.title}</p>` : ''}
                    </div>
                </div>
                <span class="text-xs font-bold px-2 py-1 rounded-full whitespace-nowrap ${statusColors[p.status] || 'bg-slate-100 text-slate-600'}">
                    ${p.status}
                </span>
            </div>
            <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed mb-4">${p.cover_letter}</p>
            ${fp?.skills ? `
                <div class="flex flex-wrap gap-1.5 mb-4">
                    ${fp.skills.split(',').slice(0, 4).map(s => `<span class="px-2 py-0.5 bg-primary/10 text-navy dark:text-primary rounded-full text-xs font-semibold">${s.trim()}</span>`).join('')}
                </div>
            ` : ''}
            ${p.status === 'PENDING' ? `
                <div class="flex gap-2">
                    <button onclick="acceptProposal(${p.id})" class="flex-1 bg-navy text-white py-2 rounded-lg text-sm font-bold hover:opacity-90 transition-all flex items-center justify-center gap-1">
                        <span class="material-symbols-outlined text-base">check_circle</span> Accept & Fund Escrow
                    </button>
                    <button onclick="rejectProposal(${p.id})" class="flex-1 border border-red-300 text-red-500 py-2 rounded-lg text-sm font-bold hover:bg-red-50 transition-all flex items-center justify-center gap-1">
                        <span class="material-symbols-outlined text-base">cancel</span> Decline
                    </button>
                </div>
            ` : ''}
            ${p.status === 'ACCEPTED' ? `
                <div class="space-y-2">
                    <div class="flex items-center gap-2 text-xs text-green-600 font-semibold bg-green-50 p-2 rounded-lg">
                        <span class="material-symbols-outlined text-base">check_circle</span>
                        Proposal accepted — work in progress
                    </div>
                    <a href="/client/escrow/fund/${p.id}/" class="flex items-center justify-center gap-2 w-full py-2.5 bg-gradient-to-r from-emerald-500 to-sky-500 text-white rounded-lg text-sm font-bold hover:brightness-110 transition-all shadow-md">
                        <span class="material-symbols-outlined text-base">account_balance_wallet</span> Fund Escrow
                    </a>
                </div>
            ` : ''}
        </div>
    `;
}

async function acceptProposal(proposalId) {
    if (!confirm('Accept this proposal? The project status will change to In Progress.')) return;
    const res = await apiCall(`/proposals/${proposalId}/accept/`, 'POST');
    if (res && res.ok) {
        const data = await res.json();
        showAlert('Proposal accepted! Redirecting to fund escrow...', 'success');
        // Redirect to escrow funding page
        const redirect = data.redirect || `/client/escrow/fund/${proposalId}/`;
        setTimeout(() => window.location.href = redirect, 1000);
    } else {
        const err = res ? await res.json() : {};
        showAlert(err.error || 'Failed to accept proposal.', 'error');
    }
}

async function rejectProposal(proposalId) {
    if (!confirm('Decline this proposal?')) return;
    const res = await apiCall(`/proposals/${proposalId}/reject/`, 'POST');
    if (res && res.ok) {
        showAlert('Proposal declined.', 'info');
        setTimeout(() => selectProject(selectedProject), 500);
    } else {
        const err = res ? await res.json() : {};
        showAlert(err.error || 'Failed to decline proposal.', 'error');
    }
}

async function deleteProject(projectId) {
    if (!confirm('Delete this project? This cannot be undone.')) return;
    const res = await apiCall(`/projects/${projectId}/`, 'DELETE');
    if (res && (res.ok || res.status === 204)) {
        showAlert('Project deleted.', 'success');
        allProjects = allProjects.filter(p => p.id !== projectId);
        document.getElementById('projects-subtitle').textContent = `${allProjects.length} project${allProjects.length !== 1 ? 's' : ''} found`;
        renderProjectList();
        if (allProjects.length > 0) {
            selectProject(allProjects[0]);
        } else {
            document.getElementById('main-content').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('hidden');
        }
    } else {
        showAlert('Failed to delete project.', 'error');
    }
}
</script>
</body>
</html>
