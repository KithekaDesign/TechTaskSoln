<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings | TechTaskSoln</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#add8e6",
                    "navy": "#1e3a8a",
                    "background-light": "#f6f7f8",
                    "background-dark": "#141c1e",
                },
                fontFamily: { "display": ["Manrope", "sans-serif"] },
                borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
        },
    }
</script>
<style>
    body { font-family: 'Manrope', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">

<main class="min-h-screen flex flex-col">
<!-- Top Nav -->
<header class="h-16 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-between px-8 sticky top-0 z-10">
<div class="flex items-center gap-3">
<button id="hamburger-btn" onclick="toggleSidebar()" class="flex items-center justify-center size-10 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-700 dark:text-slate-300" aria-label="Toggle sidebar">
    <span class="material-symbols-outlined text-2xl">menu</span>
</button>
<h2 class="text-lg font-bold text-slate-900 dark:text-white">Settings</h2>
</div>
</header>

<div class="p-8 space-y-8 max-w-3xl mx-auto w-full">
<div>
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Settings</h1>
    <p class="text-slate-500 mt-1">Manage your account preferences and appearance.</p>
</div>

<!-- Profile Info -->
<div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm p-6">
    <h3 class="font-bold text-lg mb-4">Account Information</h3>
    <div class="space-y-4">
        <div class="flex items-center gap-4">
            <div id="settings-avatar" class="size-16 rounded-full flex items-center justify-center font-bold text-xl shrink-0" style="background:linear-gradient(135deg,#6366f1,#818cf8);color:white;border:3px solid rgba(99,102,241,0.3);"></div>
            <div>
                <p class="font-bold text-lg" id="settings-name">Loading...</p>
                <p class="text-sm text-slate-500" id="settings-email"></p>
                <p class="text-xs text-slate-400 mt-1" id="settings-role"></p>
            </div>
        </div>
    </div>
</div>

<!-- Appearance -->
<div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm p-6">
    <h3 class="font-bold text-lg mb-4">Appearance</h3>
    <div class="flex items-center justify-between">
        <div>
            <p class="font-semibold">Dark Mode</p>
            <p class="text-sm text-slate-500">Toggle between light and dark themes</p>
        </div>
        <button id="theme-toggle" onclick="toggleTheme()" class="relative inline-flex h-7 w-12 items-center rounded-full transition-colors" style="background:#cbd5e1;">
            <span id="theme-dot" class="inline-block h-5 w-5 rounded-full bg-white shadow-sm transition-transform translate-x-1"></span>
        </button>
    </div>
</div>

<!-- Navigation Shortcuts -->
<div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm p-6">
    <h3 class="font-bold text-lg mb-4">Quick Links</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="quick-links">
    </div>
</div>

<!-- Danger Zone -->
<div class="bg-white dark:bg-slate-900 rounded-xl border border-red-200 dark:border-red-800/50 shadow-sm p-6">
    <h3 class="font-bold text-lg mb-4 text-red-600">Account Actions</h3>
    <div class="flex flex-wrap gap-3">
        <button onclick="logout()" class="px-4 py-2 rounded-lg border border-red-300 text-red-600 text-sm font-bold hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
            <span class="material-symbols-outlined text-sm align-middle mr-1">logout</span> Log Out
        </button>
    </div>
</div>
</div>
</main>

<script src="/static/js/api.js"></script>
<script src="/static/js/sidebar.js"></script>
<script>
(async function() {
    if (!requireAuth()) return;
    const info = await fetchUserInfo();
    if (info) {
        const initial = (info.username || 'U')[0].toUpperCase();
        document.getElementById('settings-avatar').innerHTML = `<span>${initial}</span>`;
        document.getElementById('settings-name').textContent = info.username;
        document.getElementById('settings-email').textContent = info.email;
        document.getElementById('settings-role').textContent = info.is_client ? '💼 Client Account' : info.is_freelancer ? '🚀 Freelancer Account' : '⚙ Admin Account';

        const dashBase = info.is_client ? '/client' : info.is_freelancer ? '/freelancer' : '/admin-panel';
        const links = info.is_client
            ? [
                { icon: 'dashboard', label: 'Dashboard', href: '/client/dashboard/' },
                { icon: 'work', label: 'My Projects', href: '/client/projects/' },
                { icon: 'group', label: 'Freelancers', href: '/client/freelancers/' },
                { icon: 'notifications', label: 'Notifications', href: '/notifications/' },
              ]
            : info.is_freelancer
            ? [
                { icon: 'dashboard', label: 'Dashboard', href: '/freelancer/dashboard/' },
                { icon: 'manage_accounts', label: 'Edit Profile', href: '/freelancer/profile/edit/' },
                { icon: 'bar_chart', label: 'Reports', href: '/freelancer/reports/' },
                { icon: 'notifications', label: 'Notifications', href: '/notifications/' },
              ]
            : [
                { icon: 'dashboard', label: 'Dashboard', href: '/admin-panel/' },
                { icon: 'people', label: 'Users', href: '/admin-panel/users/' },
                { icon: 'work', label: 'Projects', href: '/admin-panel/projects/' },
                { icon: 'gpp_maybe', label: 'Fraud', href: '/admin-panel/fraud/' },
              ];

        document.getElementById('quick-links').innerHTML = links.map(l =>
            `<a href="${l.href}" class="flex items-center gap-3 p-3 rounded-lg border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                <span class="material-symbols-outlined text-primary">${l.icon}</span>
                <span class="text-sm font-semibold">${l.label}</span>
            </a>`
        ).join('');
    }
})();

function toggleTheme() {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    const toggle = document.getElementById('theme-toggle');
    const dot = document.getElementById('theme-dot');
    toggle.style.background = isDark ? '#6366f1' : '#cbd5e1';
    dot.style.transform = isDark ? 'translateX(1.25rem)' : 'translateX(0.25rem)';
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

// Apply stored theme
if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.classList.add('dark');
    document.getElementById('theme-toggle').style.background = '#6366f1';
    document.getElementById('theme-dot').style.transform = 'translateX(1.25rem)';
}
</script>
</body></html>
